<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="subject" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="48" y2="48">
      <stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#9D00FF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FF0055" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#22252F"/>
      <rect width="12" height="12" fill="#353948"/>
