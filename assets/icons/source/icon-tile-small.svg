    <path d="M-40 -40H42.667L5.333 88H-40Z" fill="url(#subject)"/>
    <path d="M7 9h9v9H7z M4 19h15v12H4z M4 31h6v6H4z M13 31h6v6h-6z" fill="#FFFFFF"/><rect x="35" y="8" width="6" height="6" fill="#FF0055" fill-opacity="1"/><path d="M42.667 -40L5.333 88" stroke="#FF0055" stroke-width="4" filter="url(#glow)"/></g>
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="10.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
