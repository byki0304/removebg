# Builds the CPU engine image in Cloud Build (no local Docker needed) and pushes it to Artifact Registry.
substitutions:
  _REGION: us-east4
  _REPO: removebg
  _IMAGE: removebg-engine
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.cpu", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest", "."]
options:
  machineType: E2_HIGHCPU_8
timeout: 3600s
